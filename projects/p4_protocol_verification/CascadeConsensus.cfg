\* CascadeConsensus.cfg — TLC model checking configuration

SPECIFICATION Spec

\* Symmetry reductions (12x state space compression)
SYMMETRY PermuteNodes \union PermuteValues

CONSTANTS
    Nodes    <- {n1, n2, n3}
    Values   <- {v1, v2}
    MaxEpoch  = 3
    MaxLogIndex = 4
    f         = 1

\* Safety invariants (checked at every reachable state)
INVARIANT TypeInvariant
INVARIANT Agreement
INVARIANT LogMatching
INVARIANT LeaderCompleteness
INVARIANT EpochUniqueness

\* Temporal properties
PROPERTY SafetyProperty
PROPERTY LogMatchingProperty
PROPERTY EpochUniquenessProperty

\* For liveness checking, use LiveSpec instead:
\*   SPECIFICATION LiveSpec
\*   PROPERTY LivenessProperty

VIEW <<nodeState, currentEpoch, log, commitIndex>>

WORKERS 4
