name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov z3-solver
          pip install -e . || true

      - name: Run core infra tests
        run: |
          pytest tests/ infra/test_oracle_impl.py -v --tb=short

      - name: Run project tests
        run: |
          pytest \
            projects/p1_github_issue_fixing/ \
            projects/p2_theorem_proving/theorem_runner.py \
            projects/p3_llvm_superopt/integration_test.py \
            projects/p5_program_synthesis/sygus_solver.py \
            projects/p8_data_structures/benchmarks.py \
            projects/p9_self_improving/ \
            -v --tb=short --ignore=projects/p9_self_improving/loop_results/

      - name: Coverage report
        run: |
          pytest tests/ infra/test_oracle_impl.py \
            --cov=infra --cov=projects \
            --cov-report=term-missing \
            --cov-report=xml \
            -q

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check . --select=E,W,F --ignore=E501,E402 || true

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install mypy z3-solver
      - name: Type check infra
        run: mypy infra/ --ignore-missing-imports --no-strict-optional || true
